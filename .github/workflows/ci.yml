name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld nasm binutils gdb-multiarch \
            qemu-system-x86 qemu-system-misc qemu-utils \
            grub-pc-bin grub-common xorriso mtools \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu

      - name: Check environment
        run: bash scripts/check-env.sh

      - name: Run all lab tests (x86_64 + riscv64)
        run: bash scripts/run-all-tests.sh

      - name: Build and test integrated OS (os/, x86_64 + riscv64)
        run: |
          cd os
          make test-all
